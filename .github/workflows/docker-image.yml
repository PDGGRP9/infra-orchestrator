name: Docker Compose CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # caddy.environment uses ${SITE_DOMAIN:?} / ${ACME_EMAIL:?} (required, no
    # default) so `config` needs a .env — the committed example has valid
    # placeholder values for exactly this.
    - name: Provide a .env for interpolation
      run: cp .env.example .env
    - name: Validate docker compose configuration
      run: docker compose -f docker-compose.yml config
