services:
  db:
    image: ${DB_IMAGE:-ghcr.io/pdggrp9/infra-db:0.0.5}
    restart: unless-stopped
    # Base accessible uniquement depuis la VM (tunnel SSH pour l'admin).
    # Mettre DB_BIND=0.0.0.0 dans .env pour l'exposer publiquement.
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bracelet_connecte}
      POSTGRES_USER: ${POSTGRES_USER:-bracelet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bracelet}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bracelet} -d ${POSTGRES_DB:-bracelet_connecte}"]
      interval: 2s
      timeout: 3s
      retries: 20
  backend:
    image: ${WEBAPP_BACKEND_IMAGE:-ghcr.io/pdggrp9/webapp-backend:0.0.5}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Pas de port publié : le front (nginx) proxifie /api vers backend:8000.
    expose:
      - "8000"
    environment:
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-pdg-backend-dev-key}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-bracelet_connecte}
      DB_USER: ${POSTGRES_USER:-bracelet}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bracelet}
      # Single-origin via le proxy nginx du front : CORS non utilisé par le
      # navigateur. Renseigné uniquement si un client tape le backend en direct.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
  frontend:
    image: ${WEBAPP_FRONTEND_IMAGE:-ghcr.io/pdggrp9/webapp-frontend:0.2.0}
    restart: unless-stopped
    depends_on:
      - backend
    # L'app entière est servie ici (HTML + proxy /api). HTTP sur 8080.
    ports:
      - "${FRONTEND_PORT:-8080}:80"
  fake-emitter:
    build: ./fake-emitter
    restart: unless-stopped
    depends_on:
      - backend
    # Données de démo. Désactiver avec : docker compose up -d --scale fake-emitter=0
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      BACKEND_DATA_ENDPOINT: ${BACKEND_DATA_ENDPOINT:-/api/datas}
      DEVICE_UID: ${DEVICE_UID:-11111111-1111-1111-1111-111111111111}
      SERIAL_NUMBER: ${SERIAL_NUMBER:-FAKE-BRACELET-001}
      DISPLAY_NAME: ${DISPLAY_NAME:-Bracelet de test}
      EMIT_INTERVAL_SECONDS: ${EMIT_INTERVAL_SECONDS:-5}

volumes:
  db-data:
