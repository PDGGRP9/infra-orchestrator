services:
  db:
    image: ${DB_IMAGE:-ghcr.io/pdggrp9/infra-db:latest}
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bracelet_connecte}
      POSTGRES_USER: ${POSTGRES_USER:-bracelet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bracelet}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bracelet} -d ${POSTGRES_DB:-bracelet_connecte}"]
      interval: 2s
      timeout: 3s
      retries: 20
  backend:
    image: ${WEBAPP_BACKEND_IMAGE:-ghcr.io/pdggrp9/webapp-backend:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      DEBUG: "true"
      ALLOWED_HOSTS: "*"
      SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-pdg-backend-dev-key}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-bracelet_connecte}
      DB_USER: ${POSTGRES_USER:-bracelet}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bracelet}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
  frontend:
    image: ${WEBAPP_FRONTEND_IMAGE:-ghcr.io/pdggrp9/webapp-frontend:latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
  fake-emitter:
    build: ./fake-emitter
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      BACKEND_DATA_ENDPOINT: ${BACKEND_DATA_ENDPOINT:-/api/datas}
      DEVICE_UID: ${DEVICE_UID:-11111111-1111-1111-1111-111111111111}
      SERIAL_NUMBER: ${SERIAL_NUMBER:-FAKE-BRACELET-001}
      DISPLAY_NAME: ${DISPLAY_NAME:-Bracelet de test}
      EMIT_INTERVAL_SECONDS: ${EMIT_INTERVAL_SECONDS:-5}

volumes:
  db-data: