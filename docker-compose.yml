services:
  db:
    image: ${DB_IMAGE:-ghcr.io/pdggrp9/infra-db:0.0.5}
    restart: unless-stopped
    # Base accessible uniquement depuis la VM (tunnel SSH pour l'admin).
    # Mettre DB_BIND=0.0.0.0 dans .env pour l'exposer publiquement.
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bracelet_connecte}
      POSTGRES_USER: ${POSTGRES_USER:-bracelet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bracelet}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bracelet} -d ${POSTGRES_DB:-bracelet_connecte}"]
      interval: 2s
      timeout: 3s
      retries: 20
  backend:
    image: ${WEBAPP_BACKEND_IMAGE:-ghcr.io/pdggrp9/webapp-backend:0.0.5}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Pas de port publié : le front (nginx) proxifie /api vers backend:8000.
    expose:
      - "8000"
    environment:
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-pdg-backend-dev-key}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-bracelet_connecte}
      DB_USER: ${POSTGRES_USER:-bracelet}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bracelet}
      # Single-origin via le proxy nginx du front : CORS non utilisé par le
      # navigateur. Renseigné uniquement si un client tape le backend en direct.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
      # TLS terminé par Caddy : il transmet X-Forwarded-Proto=https, Django doit
      # le croire pour reconstruire des URL absolues en https.
      SECURE_PROXY_SSL_HEADER: ${SECURE_PROXY_SSL_HEADER:-HTTP_X_FORWARDED_PROTO,https}
      # HSTS : 0 pour commencer (le temps de valider le certificat), puis passer
      # à 31536000 dans .env une fois le HTTPS stable.
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
  frontend:
    image: ${WEBAPP_FRONTEND_IMAGE:-ghcr.io/pdggrp9/webapp-frontend:0.2.0}
    restart: unless-stopped
    depends_on:
      - backend
    # Sert la SPA + proxifie /api vers backend:8000. Plus publié directement :
    # Caddy est le seul point d'entrée public (80/443). HTTP interne sur 80.
    expose:
      - "80"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    # Unique point d'entrée public. Termine le TLS (Let's Encrypt automatique)
    # et redirige 80 -> 443. Reverse proxy vers le conteneur frontend.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?definir SITE_DOMAIN dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?definir ACME_EMAIL dans .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
