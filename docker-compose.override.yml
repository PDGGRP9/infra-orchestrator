services:
  db:
    build:
      context: ../infra-db
    pull_policy: build          # rebuild à chaque `up` au lieu de réutiliser/puller l'image
    image: pdg-local/infra-db:dev        # tag local distinct -> n'écrase pas ghcr.io/pdggrp9/infra-db
  backend:
    build:
      context: ../webapp-backend
    pull_policy: build
    image: pdg-local/webapp-backend:dev
  frontend:
    build:
      context: ../webapp-frontend
    pull_policy: build
    image: pdg-local/webapp-frontend:dev
